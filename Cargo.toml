[package]
name = "speak-playground"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "z"
lto = true

[dependencies]
web-sys = { version = "0.3.106", features = ["HtmlTextAreaElement", "HtmlSelectElement"] }
yew = { version = "0.23.0", features = ["csr"] }
speak-core = { git = "https://github.com/speak-lang/speak", branch = "development" }
